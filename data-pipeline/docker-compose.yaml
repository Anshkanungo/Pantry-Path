# Airflow 3.3 for the Pantry Path data pipeline (local development only).
#
# Based on the official docker-compose.yaml for Airflow 3.3.2, trimmed to the
# LocalExecutor + Postgres (no Celery workers, Redis or Flower): the scheduler runs
# every task itself, which is all this pipeline needs.
#
#   cd data-pipeline
#   docker compose up -d --build     # first run builds the image (a few minutes)
#   open http://localhost:8080       # login: airflow / airflow
#   docker compose down              # stop (add -v to also delete Airflow's database)
#
# The whole repo is mounted at /opt/pantrypath, so code, config, data, reports and
# logs are shared live with your machine. Secrets stay in the repo-root .env: every
# pipeline step reads it when it starts, so edits apply without restarting Airflow.
# (No env_file on purpose: an empty value loaded at container start, e.g.
# LLM_API_KEY=, would hide a key you add to .env later.)
#
# Linux only: run `echo "AIRFLOW_UID=$(id -u)" > .env` in this folder first, so files
# the containers write stay owned by you. Docker Desktop on macOS handles this itself.
name: pantrypath

x-airflow-common:
  &airflow-common
  build: .
  image: pantrypath-airflow:3.3.2
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_FOLDER: /opt/pantrypath/data-pipeline/dags
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-pantrypath_local_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Look for new DAG files every 30 s instead of every 5 min
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: '30'
    # Task logs next to the pipeline's own logs/pipeline.log
    AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/pantrypath/data-pipeline/logs/airflow
    PANTRYPATH_HOME: /opt/pantrypath/data-pipeline
  volumes:
    - ..:/opt/pantrypath
    # GCP key folder for DVC pushes, mounted at the same path as on your machine, so a
    # credentialpath in .dvc/config.local works both on the host and in the containers
    - ${HOME}/.config/gcp-keys:${HOME}/.config/gcp-keys:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # One-off: create/upgrade Airflow's database and the admin login, then exit.
  # (Unlike the official file, it doesn't chown anything: the repo is your folder.)
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/pantrypath/data-pipeline/logs/airflow
        /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}

  # Ad-hoc commands: docker compose run --rm airflow-cli airflow dags list
  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow

volumes:
  postgres-db-volume:
